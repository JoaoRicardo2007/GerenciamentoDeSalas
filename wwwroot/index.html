<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceFlow · Dashboard</title>
    <meta name="description" content="Monitoramento de salas e laboratórios em tempo real.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topo">
        <div class="topo-linha">
            <div class="marca">
            <!-- Logo oficial inserida aqui -->
                <img src="img/SENAI_logo_2024.png" alt="Logo SENAI" class="marca-logo-img">
            
                <div class="marca-texto">
                    <h1>Controle de Ambientes</h1>
                    <p class="subtitulo">Monitoramento de salas e laboratórios em tempo real</p>
                </div>
            </div>

            <section class="leitor" aria-label="Resumo de ocupação">
                <time class="leitor-item leitor-relogio" id="relogio">--:--:--</time>
                <div class="leitor-item">
                    <span class="led led--livre" aria-hidden="true"></span>
                    <span>Livres <strong id="contagem-livre">0</strong></span>
                </div>
                <div class="leitor-item">
                    <span class="led led--ocupada" aria-hidden="true"></span>
                    <span>Ocupadas <strong id="contagem-ocupada">0</strong></span>
                </div>
            </section>
        </div>
    </header>

    <div id="aviso-demo" class="aviso-demo" hidden>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <p>Conexão API indisponível. Exibindo mock de dados.</p>
    </div>

    <main id="app">
        <header class="cabecalho-visao" id="cabecalho-visao" hidden>
            <button type="button" class="btn-voltar" id="btn-voltar" onclick="voltar()" aria-label="Voltar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span id="btn-voltar-texto">Início</span>
            </button>
            <h2 class="titulo-visao" id="titulo-visao"></h2>
        </header>

        <section id="grid-salas" class="grid-salas" aria-live="polite">
            <p class="carregando">Sincronizando...</p>
        </section>
    </main>

    <div id="modal-overlay" class="modal-overlay" hidden>
        <dialog class="modal" id="modal-dialog" open aria-labelledby="modal-titulo">
            <header class="modal-header">
                <div class="modal-icone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0110 0v4"></path></svg>
                </div>
                <div>
                    <h2 id="modal-titulo">Sala</h2>
                    <p class="modal-sub" id="modal-sub"></p>
                </div>
            </header>

            <form id="modal-form" class="modal-form">
                <label class="campo" id="campo-docente" hidden>
                    <span class="campo-rotulo">Docente responsável</span>
                    <input type="text" id="input-docente" class="campo-input" autocomplete="off" placeholder="Nome completo">
                </label>

                <label class="campo" id="campo-turma" hidden>
                    <span class="campo-rotulo">Turma</span>
                    <select id="input-turma" class="campo-input">
                        <option value="">Selecione uma turma</option>
                    </select>
                </label>

                <label class="campo" id="campo-turma-extra" hidden>
                    <span class="campo-rotulo">Nova turma</span>
                    <input type="text" id="input-turma-extra" class="campo-input" autocomplete="off" placeholder="Ex: 4A">
                </label>

                <div class="campo-dupla" id="campo-horario" hidden>
                    <label class="campo">
                        <span class="campo-rotulo">Início do uso</span>
                        <input type="time" id="input-horario-inicio" class="campo-input">
                    </label>

                    <label class="campo">
                        <span class="campo-rotulo">Fim do uso</span>
                        <input type="time" id="input-horario-fim" class="campo-input">
                    </label>
                </div>

                <label class="campo">
                    <span class="campo-rotulo">Senha de autenticação</span>
                    <input type="password" id="input-senha" class="campo-input" autocomplete="off" placeholder="••••••••">
                </label>

                <p class="modal-erro" id="modal-erro" hidden role="alert"></p>

                <footer class="modal-acoes">
                    <button type="button" class="btn btn-secundario" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primario" id="modal-confirmar">Confirmar</button>
                </footer>
            </form>
        </dialog>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
